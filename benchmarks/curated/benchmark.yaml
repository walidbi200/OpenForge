    verified_date: "2026-07-26"
    title: "(placeholder — no suitable open bug found during sweep)"
    verified_open: false
    labels: []
    assignee: null
    requires_human: false
    expected_files: []
    expected_tests: []
    notes: >
      During manual API sweep (2026-07-26) the Flask open-issues list
      contained only docs/typing issues and feature requests. No clearly
      reproducible, unassigned, open bug was found. This slot is reserved
      for a future verified issue.

metadata:
  created: "2026-07-26"
  verifier: "OpenForge automated validation script + manual API inspection"
  criteria:
    - issue must be OPEN (verified via GitHub REST API state field)
    - must NOT be a PR (verified via absence of 'pull_request' key)
    - must NOT have a merged fix already linked (verified via timeline scan)
    - preferably bug label
    - preferably reproducible (minimal reproducer or clear error description)
    - preferably unassigned (no assignee)
    - small-to-medium scope (single-module or two-module fixes preferred)
  total_verified: 8
  repositories_covered:
    - sanic-org/sanic
    - python/cpython
    - pallets/click
